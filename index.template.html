<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/brand/opencrvs.css" />
    <style>
      main {
        max-width: var(--column);
        margin: 0 auto;
        padding: 40px 16px 0;
      }
      header {
        margin-bottom: 40px;
      }
      header h1 {
        margin: 8px 0 12px;
      }
      header .lede {
        margin: 0;
      }
      .count {
        margin-bottom: 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--border-default);
      }
      li {
        border-bottom: 1px solid var(--border-default);
      }
      li a {
        display: grid;
        grid-template-columns: 112px 1fr;
        column-gap: 24px;
        padding: 20px 12px;
        color: inherit;
        text-decoration: none;
      }
      li a:hover {
        background: var(--surface-selected);
        color: inherit;
      }
      li a:hover .title {
        text-decoration: underline;
      }
      time {
        grid-row: span 3;
        font-size: 14px;
        line-height: 1.75;
        color: var(--text-tertiary);
      }
      .title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--text-link);
        text-underline-offset: 0.15em;
      }
      .desc {
        margin-top: 4px;
        color: var(--text-secondary);
      }
      .author {
        margin-top: 6px;
        font-size: 14px;
        color: var(--text-tertiary);
      }
      .empty {
        padding: 24px 12px;
        color: var(--text-tertiary);
      }
      @media (max-width: 560px) {
        li a {
          grid-template-columns: 1fr;
          padding: 16px 8px;
        }
        time {
          grid-row: auto;
          line-height: 1.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-header">
      <a class="logo" href="/"><img src="/brand/opencrvs-logo-primary.svg" alt="OpenCRVS" width="152" height="48" /></a>
    </div>
    <main>
      <header>
        <p class="eyebrow">{{title}}</p>
        <h1>Notes from the core team</h1>
        <p class="lede">{{description}}</p>
      </header>
      <p class="eyebrow count">{{count}}</p>
      <ul>
{{posts}}
      </ul>
    </main>
    <footer class="site-footer">
      <div class="inner">
        <a href="https://www.opencrvs.org/"><img src="/brand/opencrvs-logo-white.svg" alt="OpenCRVS" width="152" height="49" /></a>
        <span>Civil registration for everyone · <a href="https://github.com/opencrvs/opencrvs.dev">Source on GitHub</a></span>
      </div>
    </footer>
  </body>
</html>
