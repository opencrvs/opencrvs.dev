<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f6f4;
        --surface: #ffffff;
        --text: #222222;
        --muted: #676767;
        --line: #e2e2de;
        --accent: #0d6e5a;
        --accent-soft: #e3f1ed;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #141615;
          --surface: #1c1f1e;
          --text: #ececea;
          --muted: #9a9e9c;
          --line: #2c302f;
          --accent: #5cc4a8;
          --accent-soft: #1f2e2a;
        }
      }
      :root[data-theme='dark'] {
        --bg: #141615;
        --surface: #1c1f1e;
        --text: #ececea;
        --muted: #9a9e9c;
        --line: #2c302f;
        --accent: #5cc4a8;
        --accent-soft: #1f2e2a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 'Noto Sans', system-ui, sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 64px 16px 96px;
      }
      header {
        margin-bottom: 40px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      h1 span {
        color: var(--accent);
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .count {
        font: 12px 'JetBrains Mono', ui-monospace, monospace;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0 0 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      li a {
        display: grid;
        grid-template-columns: 110px 1fr;
        column-gap: 20px;
        padding: 16px 8px;
        color: inherit;
        text-decoration: none;
        border-radius: 6px;
      }
      li a:hover,
      li a:focus-visible {
        background: var(--accent-soft);
        outline: none;
      }
      time {
        grid-row: span 3;
        font: 13px/1.9 'JetBrains Mono', ui-monospace, monospace;
        color: var(--muted);
      }
      .title {
        font-weight: 600;
        color: var(--accent);
      }
      .desc {
        color: var(--text);
        font-size: 15px;
        margin-top: 2px;
      }
      .author {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .empty {
        padding: 24px 8px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        main {
          padding-top: 40px;
        }
        li a {
          grid-template-columns: 1fr;
        }
        time {
          grid-row: auto;
          line-height: 1.5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>opencrvs<span>.dev</span></h1>
        <p>{{description}}</p>
      </header>
      <p class="count">{{count}}</p>
      <ul>
{{posts}}
      </ul>
    </main>
  </body>
</html>
